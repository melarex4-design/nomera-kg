<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Номера KG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Saira+Condensed:wght@500;600;700&family=Barlow+Semi+Condensed:wght@500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE азартная игра-коллекционер, ночной Бишкек
   IDEA настоящий кыргызский госномер (01 123ABC и старый B 1234 AB) как выигрыш на барабане
   PICTURE крупный номер с флагом и солнцем, который прокручивается и вспыхивает цветом редкости
   COLOUR ночь #090d18, красный флага #e8112d, солнце #ffd400, цвета редкости
   TYPE Barlow Condensed (как DIN на номерах) + Manrope
   LAYOUT шапка с балансом; экран: редкость, номер, кнопки, последние; сейф списком; нижняя навигация */
:root{color-scheme:dark;--bg:#090d18;--p1:#121827;--p2:#1b2336;--line:#263049;--ink:#eef2f8;--mut:#8d97ab;--red:#e8112d;--sun:#ffd400;
--c0:#9aa3b5;--c1:#3fd07f;--c2:#4a95ff;--c3:#b065ff;--c4:#ffb321}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:radial-gradient(120% 60% at 50% -10%,#1a2340 0,var(--bg) 60%) no-repeat,var(--bg)}
body{margin:0;background:transparent;color:var(--ink);font:16px/1.5 Manrope,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left)) 120px}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 0 12px;position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
header h1{font-size:22px;margin:0;flex:1;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.bal{display:flex;align-items:center;gap:8px;background:var(--p2);border:1px solid var(--line);border-radius:99px;padding:6px 14px 6px 8px;font-weight:800;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:background .3s}
.bal i{width:22px;height:22px;border-radius:50%;background:var(--sun);color:#3a2a00;font:800 12px/22px Manrope;text-align:center;font-style:normal}
.bal.up{background:#163a26}.bal.down{background:#3a1620}
.view{display:none}.view.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--p1) 92%,transparent);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav div{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:560px}
nav button{padding:9px 4px 11px;font-size:13px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px}
nav button svg{width:25px;height:25px}
nav button{position:relative}
nav button::before{content:"";position:absolute;top:7px;left:50%;width:58px;height:32px;margin-left:-29px;border-radius:16px;background:transparent;transition:background .2s}
nav button svg{position:relative}
nav button.on{color:var(--ink)}nav button.on svg{color:var(--red)}nav button.on::before{background:#e8112d22}
.sky{position:fixed;top:0;left:0;right:0;height:min(46vh,380px);z-index:-1;pointer-events:none;opacity:.9}
.sky svg{width:100%;height:100%;display:block}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
header .logo{display:inline-flex;width:30px;height:20px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #ffffff22;flex:none}
header .logo svg{width:100%;height:100%}
.stat span{display:block;font-size:12px;color:var(--mut);font-weight:600}
.stat span{white-space:nowrap}
.stat b{display:block;font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.stat b.pos{color:var(--c1)}.stat b.neg{color:#ff6b80}
.b2,.chips button,.mini,.row,.stat,.opt,.selbtn{transition:transform .12s,background .2s,border-color .2s}
.b2:active,.chips button:active,.mini:active,.row:active,.opt:active,.selbtn:active{transform:scale(.97)}
.lock .plate{animation:thud .18s ease-out}
@keyframes thud{50%{transform:translateY(1.5px)}}
nav b{position:absolute;margin-left:22px;margin-top:-4px;background:var(--red);color:#fff;font-size:11px;border-radius:99px;padding:0 6px;line-height:17px}
/* номер */
.pw{container-type:inline-size;width:100%}
.plate{position:relative;display:flex;background:#fff;border:.5cqw solid #4b4b4b;border-radius:2.6cqw;aspect-ratio:520/112;color:#373737;box-shadow:0 1.2cqw 3.5cqw #0008;overflow:hidden;padding:1cqw}
.plate::before{content:"";position:absolute;inset:1cqw;border:.4cqw solid #4b4b4b;border-radius:1.8cqw;pointer-events:none}
.plate .l{width:20%;border-right:.4cqw solid #4b4b4b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;padding:1cqw 0}
.plate .rg{font:600 12.5cqw/.8 'Saira Condensed','Arial Narrow','Liberation Sans Narrow',sans-serif;letter-spacing:-.3cqw}
.plate .kg{display:flex;align-items:center;gap:1.2cqw;font:600 5.8cqw/.8 'Saira Condensed','Arial Narrow','Liberation Sans Narrow',sans-serif}
.plate .kg svg{width:8cqw;height:5.2cqw}
.plate .m{flex:1;display:flex;align-items:baseline;justify-content:center;gap:2.6cqw;font-family:'Saira Condensed','Arial Narrow','Liberation Sans Narrow',sans-serif;font-weight:600;padding-top:2cqw;white-space:nowrap;overflow:hidden}
.plate .dg{font-size:21cqw;line-height:.78;letter-spacing:-.2cqw}
.plate .lt{font-size:14.5cqw;line-height:.78;letter-spacing:.2cqw}
.plate.old{border:.6cqw solid #1c1c1c;border-radius:1.8cqw;padding:0;color:#141414;background:linear-gradient(180deg,#fff,#eef0f3)}
.plate.old::before{display:none}
.plate.old .l{width:10%;background:linear-gradient(180deg,#e0303c,#b8121f);border-right:0;padding:0}
.plate.old .l svg{width:7cqw;height:7cqw}
.plate.old .m{align-items:center;gap:4.2cqw;font-family:'Barlow Semi Condensed','Arial',sans-serif;font-weight:600;padding-top:.6cqw}
.plate.old .dg,.plate.old .lt{font-size:15.5cqw;line-height:1;letter-spacing:.3cqw}
.plate::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff9 48%,transparent 62%);transform:translateX(-120%)}
.shine .plate::after{animation:shine .9s ease-out .1s}
@keyframes shine{to{transform:translateX(120%)}}
.rolling .m{filter:blur(.35cqw)}
/* прокрутка */
.stage{position:relative;display:grid;gap:14px;padding:6px 0 4px}
.glow{position:absolute;inset:-40px -16px 0;background:radial-gradient(55% 45% at 50% 42%,color-mix(in srgb,var(--rc,var(--c0)) 40%,transparent),transparent 72%);transition:background .5s;z-index:-1;pointer-events:none}
.rar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--p1);border:1px solid color-mix(in srgb,var(--rc,var(--line)) 45%,var(--line));border-radius:18px;padding:12px 16px;min-height:70px}
.rar b{color:var(--rc,var(--mut));font-size:16px;font-weight:800}
.rar .pr small{display:block;text-align:right;font-size:13px;color:var(--mut);font-weight:700;letter-spacing:0}
.rar .pr{font-size:clamp(22px,7vw,32px);font-weight:800;color:var(--rc,var(--ink));white-space:nowrap;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dots{display:flex;gap:5px;margin-top:6px}.dots i{width:20px;height:5px;border-radius:3px;background:#2a3249}.dots i.f{background:var(--rc)}
.platebox{padding:10px 0 4px}
.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.9)}}
.legend .plate{box-shadow:0 0 0 1cqw var(--c4),0 0 10cqw var(--c4)}
.feat{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;min-height:34px}
.feat span{background:var(--p2);border-radius:99px;padding:4px 11px;font-size:14px;font-weight:600}
.feat span.o{color:var(--sun);background:#33290a}
.feat .hint{color:var(--mut);background:none;font-weight:500;text-align:center}
.note{background:#241d05;border:1px solid #4d3d0a;color:#ffe089;border-radius:14px;padding:10px 14px;font-size:14px}
.go{display:flex;flex-direction:column;align-items:center;width:100%;background:linear-gradient(180deg,#ff2a45,var(--red));border-radius:20px;padding:15px;font-size:21px;font-weight:800;box-shadow:0 6px 0 #930a1c,0 10px 30px #e8112d44;transition:transform .08s,box-shadow .08s;line-height:1.15}
.go small{font-size:14px;font-weight:700;opacity:.85}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 #930a1c}
.go:disabled{background:#3a2230;box-shadow:0 6px 0 #1f1219;color:#a98a95}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.b2{background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:11px 8px;font-weight:700;min-height:50px;line-height:1.2;font-size:15px}
.b2 small{display:block;color:var(--mut);font-weight:600;font-size:13px}
.b2:disabled{opacity:.4}
.b2.sell{background:#13301f;border-color:#1f5134}.b2.sell small{color:#7fdca5}
.broke[hidden]{display:none}
.broke{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;color:var(--mut);display:flex;gap:12px;align-items:center}
.broke .b2{flex:none;padding:8px 14px}
h2{font-size:17px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 button{font-size:14px;color:var(--mut);font-weight:600;padding:8px 0}
.recent{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mini{background:var(--p1);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:left}
.mini div.v{display:flex;justify-content:space-between;margin-top:7px;font-size:13px;color:var(--mut)}
.mini div.v b{color:var(--rc);font-size:14px;white-space:nowrap}
/* сейф */
.sum{background:linear-gradient(135deg,#1c2540,#121827);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.sum .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sum b{font-size:clamp(24px,7vw,30px);font-weight:800;white-space:nowrap;letter-spacing:-.02em}
.sum span{color:var(--mut);font-size:14px}
.sum .s{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin:6px 0 10px}
.sum .s em{font-style:normal;color:var(--ink);font-weight:700;white-space:nowrap}
.sum .b2{width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:700;font-size:15px;min-height:44px;white-space:nowrap}
.chips button.on{background:#2453c9;border-color:#2453c9}
.chips button.add{border-style:dashed;color:var(--mut)}
.chips button small{opacity:.7;font-weight:600;margin-left:5px}
.colbar{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut);margin:-4px 0 6px;flex-wrap:wrap}
.colbar button{text-decoration:underline;padding:8px 6px;min-height:44px}
.tools{display:flex;gap:8px;align-items:center}
.search{flex:1;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;min-height:46px}
.selbtn{background:var(--p2);border:1px solid var(--line);border-radius:12px;padding:0 14px;font-weight:700;min-height:46px}
.selbtn.on{background:var(--sun);color:#221a00;border-color:var(--sun)}
.list{display:grid;gap:10px;padding:12px 0}
.row{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:center;gap:12px;padding:11px 12px;border-radius:16px;background:linear-gradient(90deg,color-mix(in srgb,var(--rc) 20%,var(--p1)),var(--p1) 70%);border:1px solid color-mix(in srgb,var(--rc) 30%,var(--line));text-align:left;width:100%;position:relative}
.row .meta{text-align:right;font-size:13px;color:var(--mut);line-height:1.35}
.row .meta .dots{justify-content:flex-end}
.row .meta b{display:block;color:var(--ink);font-size:17px;white-space:nowrap;margin-top:4px;font-variant-numeric:tabular-nums}
.row .meta em{font-style:normal;color:var(--sun)}
.row .ck{position:absolute;left:-6px;top:-6px;width:24px;height:24px;border-radius:50%;border:2px solid var(--mut);background:var(--bg);display:none}
.selmode .row .ck{display:block}
.list.selmode{padding-bottom:90px}
.row.sel{outline:2px solid var(--sun);outline-offset:-1px}
.row.sel .ck{background:var(--sun);border-color:var(--sun)}
.row.sel .ck::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid #221a00;border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.bar{position:fixed;left:0;right:0;bottom:calc(68px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:5}
.bar[hidden]{display:none}
.bar div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:528px;background:var(--p1);border:1px solid var(--line);padding:8px;border-radius:18px;box-shadow:0 10px 30px #000c}
.bar button{background:var(--p2);border-radius:12px;padding:10px 6px;font-weight:700;font-size:14px;min-height:48px;line-height:1.2}
.bar .red{background:var(--red)}
.bar button:disabled{opacity:.4}
/* шторка */
.shade{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shade[hidden]{display:none}
.sheet{background:var(--p1);border-top:1px solid var(--line);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#3a4560;margin:0 auto 12px}
.sheet h3{margin:0 0 4px;font-size:21px;letter-spacing:-.02em}.sheet p{margin:0 0 12px;color:var(--mut);font-size:14px}
.opt{display:flex;justify-content:space-between;width:100%;background:var(--p2);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:700;min-height:48px;text-align:left}
.opt span{color:var(--mut);font-weight:500}
.new{display:flex;gap:8px;margin:6px 0 8px}.new input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px}
.new button{background:#2453c9;border-radius:12px;padding:0 16px;font-weight:800;min-height:48px}
.cancel{width:100%;color:var(--mut);padding:12px;min-height:44px}
.danger{background:#3d1520!important;color:#ff9aa8}
.det{display:grid;gap:12px}
.det .big{padding:8px 0}
.det .pr{font-size:30px;font-weight:800;color:var(--rc)}
.grid10{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--sun);color:#1c1500;font-weight:800;padding:10px 18px;border-radius:14px;transition:.25s;z-index:30;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px #0008}
.toast.on{opacity:1;transform:translate(-50%,0)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--p1);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:6px}
.modes button{border-radius:12px;padding:8px 6px;font-weight:800;font-size:15px;color:var(--mut);min-height:48px;line-height:1.15}
.modes button small{display:block;font-size:12px;font-weight:600}
.modes button.on{background:var(--p2);color:var(--ink);box-shadow:0 2px 10px #0006}
.sim{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3.5cqw;aspect-ratio:520/140;border-radius:3.2cqw;background:var(--op);color:var(--opi);padding:3cqw 4cqw;box-shadow:inset 0 0 0 .4cqw #ffffff40,0 1.5cqw 4cqw #0009;overflow:hidden;clip-path:polygon(0 0,calc(100% - 9cqw) 0,100% 9cqw,100% 100%,0 100%)}
.sim .chip{width:11cqw;aspect-ratio:1.3;border-radius:2cqw;background:linear-gradient(90deg,transparent 31%,#8a6a10 31% 33%,transparent 33% 67%,#8a6a10 67% 69%,transparent 69%),linear-gradient(0deg,transparent 46%,#8a6a10 46% 54%,transparent 54%),linear-gradient(135deg,#fbe7a1,#c99a22);box-shadow:inset 0 0 0 .4cqw #8a6a1088}
.sim .r{display:grid;gap:1.2cqw;justify-items:start}
.sim .st{display:flex;gap:2.4cqw;align-items:center;font:800 4.6cqw/1 Manrope,sans-serif}
.sim .st span{font-weight:700;padding:.6cqw 2cqw;border-radius:9cqw;background:#0000002a}
.sim .sn{font:700 10.6cqw/1 'Barlow Condensed',sans-serif;letter-spacing:0;white-space:nowrap}
.sim .sn i{font-style:normal;opacity:.6}
.sim::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,#fff8 48%,transparent 62%);transform:translateX(-120%)}
.shine .sim::after{animation:shine .9s ease-out .1s}
.legend .sim{box-shadow:inset 0 0 0 .4cqw #fff6,0 0 0 1cqw var(--c4),0 0 10cqw var(--c4)}
.lock .sim{animation:thud .18s ease-out}
@media (prefers-reduced-motion:reduce){.pop,.shine .plate::after,.shine .sim::after,.sheet,.lock .plate,.lock .sim{animation:none}}
/* минимализм */
.info{width:40px;height:40px;border-radius:50%;background:var(--p2);border:1px solid var(--line);font-weight:800;color:var(--mut);flex:none}
.modes{margin:2px auto 4px;max-width:300px;border-radius:99px;padding:3px}
.modes button{border-radius:99px;min-height:40px;padding:6px;font-size:14px}
.stage{gap:10px;padding:8px 0 0}
.rar{background:none;border:0;min-height:0;padding:0;justify-content:center;gap:10px;flex-direction:column}
.rar b{font-size:14px;letter-spacing:.02em;min-height:20px;text-align:center}
.rar .dots{justify-content:center;margin:0}
.platebox{padding:6px 0 0}
#rprice{text-align:center;font-size:clamp(30px,10vw,42px);font-weight:800;letter-spacing:-.03em;color:var(--rc,var(--ink));min-height:48px;line-height:1.15;font-variant-numeric:tabular-nums}
#rprice small{display:block;font-size:14px;color:var(--mut);font-weight:700;letter-spacing:0}
.feat{min-height:30px}
.feat span{font-size:13px;padding:3px 10px}
#v-spin .note{display:none!important}
.go{padding:14px;font-size:20px;margin-top:4px}
.go small{font-size:13px}
.b2{min-height:46px;padding:8px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:16px 0 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .mini{flex:none;width:148px;padding:8px}
.strip .mini div.v{margin-top:6px;justify-content:flex-end}
.strip .empty{padding:8px;font-size:14px}
.sum .s{gap:12px;margin:6px 0 10px}
.sum .s button{color:var(--mut);font-size:13px;padding:0}
.chips .grp{display:flex;gap:8px;flex:none}
.chips .sep{flex:none;width:1px;background:var(--line);margin:6px 2px}
.chips button{padding:7px 12px;font-size:14px}
.row{content-visibility:auto;contain-intrinsic-size:auto 92px}
.sum em.pos{color:var(--c1)}.sum em.neg{color:#ff6b80}
.rl ul{padding-left:18px;margin:6px 0 10px;color:var(--mut);font-size:14px}.rl li{margin:6px 0}
.row{padding:10px 12px;contain-intrinsic-size:auto 80px}
.row .meta b{font-size:18px}
.sum{padding:12px 14px}
.nick{max-width:110px;height:40px;border-radius:99px;background:var(--p2);border:1px solid var(--line);padding:0 12px;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
header h1{min-width:0}header #ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.welcome{position:fixed;inset:0;z-index:40;background:radial-gradient(120% 70% at 50% 0,#1d2748,var(--bg) 70%);display:flex;align-items:center;justify-content:center;padding:24px}

/* ===== оценка нового номера ===== */

function valueSim(pre,s){

function multiSpin(n,title){
  const C=cost();if(spinning||n<1||S.bal<C*n)return;
  S.bal-=C*n;S.spent+=C*n;
  const got=[];for(let i=0;i<n;i++){const p=makeItem();p.t+=i;S.col.push(p);got.push(p);track(p)}
  got.sort((a,b)=>b.price-a.price);S.last=got[0].id;save();drawBal();showResult(got[0],true);drawRecent();drawStats();if(got[0].tier>=2)burst(got[0].tier);
  const total=got.reduce((s,p)=>s+p.price,0),paid=C*n,cheap=got.filter(p=>p.price<costOf(p)),top=got.slice(0,10);
  const diff=total-paid;
  openSheet(`<h3>${title}</h3><p>${n} шт · потрачено ${fmt(paid)} · стоят ${fmt(total)}</p>
    <div class="allin-res ${diff>=0?'win':'loss'}">${diff>=0?'+':'−'}${fmt(Math.abs(diff))}</div>
    ${n>10?'<p>Лучшие 10:</p>':''}
    <div class="grid10">${top.map(p=>`<div class="mini" style="--rc:${rc(p.tier)}"><div class="pw">${itemHTML(p)}</div><div class="v"><span>${RAR[p.tier][0]}</span><b>${fmt(p.price)}</b></div></div>`).join('')}</div>
    ${cheap.length?`<button class="opt" id="sellCheap">Продать дешёвые (${cheap.length} шт)<span>+${fmt(cheap.reduce((s,p)=>s+p.price,0))}</span></button>`:''}
    <button class="opt" id="sellAllGot">Продать все выпавшие<span>+${fmt(total)}</span></button>
    <button class="opt" id="ok10">Всё в сейф<span>${got.length} шт</span></button>`);
  $('sheet').onclick=e=>{if(e.target.closest('#sellCheap')){sell(cheap.map(p=>p.id));closeSheet()}else if(e.target.closest('#sellAllGot')){sell(got.map(p=>p.id));closeSheet()}else if(e.target.closest('#ok10'))closeSheet()};
  const best=got[0];if(best.tier>=3){toast(RAR[best.tier][0]+'! '+fmt(best.price));vibrate(80)}
}

        try{const c=JSON.parse(localStorage.getItem(LK)||'null');if(c)applyState(c)}catch(_){}
        toast('Нет связи — прогресс сохранится, когда появится интернет');
      }
      pendSt=null;$('splash').hidden=true;$('auth').hidden=true;$('aPass').value='';$('aPass2').value='';$('aCode').value='';
    });
  }
}
