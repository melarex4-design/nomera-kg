<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0b">
<title>Номера KG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0a0a0b;--card:#141416;--card2:#1c1c1f;--line:#26262a;--ink:#f4f4f5;--mut:#8a8a93;--red:#b8373f;--red2:#962c33;--green:#3ddc84;
--c0:#8a8a93;--c1:#3ddc84;--c2:#5b9dff;--c3:#b27cff;--c4:#ffc533}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:-.005em}
body{min-height:100vh;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 0 10px}
.lvl{flex:1;display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:6px 12px 6px 6px;text-align:left;min-height:48px}
.lvl b{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--card2);font-weight:700;font-size:15px;flex:none}
.lvl .pb{flex:1;display:grid;gap:5px}
.lvl small{font-size:12px;color:var(--mut);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:var(--card2);overflow:hidden}.bar i{display:block;height:100%;background:#4fb37e;border-radius:2px;transition:width .4s}
.bal{background:var(--card);border-radius:14px;padding:0 14px;min-height:48px;display:flex;align-items:center;font-weight:700;font-size:17px;white-space:nowrap;font-variant-numeric:tabular-nums;transition:color .3s}
.bal.up{color:var(--green)}.bal.down{color:#ff6b6b}
.me{width:48px;height:48px;border-radius:14px;background:var(--card);font-weight:700;color:var(--mut);flex:none;font-size:17px}
.view{display:none}.view.on{display:block}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border-radius:12px;padding:3px;gap:3px}
.seg button{border-radius:10px;min-height:40px;font-weight:600;font-size:15px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--ink)}
/* номер (SVG — пропорции как у настоящего знака) */
.pw{width:100%;container-type:inline-size}
.plate{display:block;width:100%;height:auto}
.plate text{font-family:'Barlow','Arial Narrow',sans-serif;font-weight:600;fill:#1d1d1d}
/* сим */
.sim{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:3.5cqw;aspect-ratio:520/140;border-radius:3.2cqw;background:var(--op);color:var(--opi);padding:3cqw 4cqw;overflow:hidden;clip-path:polygon(0 0,calc(100% - 9cqw) 0,100% 9cqw,100% 100%,0 100%)}
.sim .chip{width:11cqw;aspect-ratio:1.3;border-radius:2cqw;background:linear-gradient(90deg,transparent 31%,#8a6a10 31% 33%,transparent 33% 67%,#8a6a10 67% 69%,transparent 69%),linear-gradient(0deg,transparent 46%,#8a6a10 46% 54%,transparent 54%),linear-gradient(135deg,#fbe7a1,#c99a22)}
.sim .r{display:grid;gap:1.2cqw;justify-items:start}
.sim .st{display:flex;gap:2.4cqw;align-items:center;font:700 4.6cqw/1 Inter,sans-serif}
.sim .st span{font-weight:600;padding:.6cqw 2cqw;border-radius:9cqw;background:#0000002a}
.sim .sn{font:500 10.6cqw/1 'Barlow',sans-serif;white-space:nowrap}
.sim .sn i{font-style:normal;opacity:.65}
/* экран прокрутки */
.stage{display:grid;gap:12px;padding-top:14px}
.big{padding:4px 0}
.pop{animation:pop .4s cubic-bezier(.2,1.5,.4,1)}@keyframes pop{from{transform:scale(.94)}}
.lock .plate,.lock .sim{animation:thud .16s ease-out}@keyframes thud{50%{transform:translateY(1.5px)}}
.res{display:grid;gap:8px;min-height:104px;padding:4px 2px}
.res .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rar{display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--mut);white-space:nowrap}
.rar::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--rc)}
.price{font-size:clamp(30px,9vw,38px);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.price small{font-size:14px;color:var(--mut);font-weight:500;letter-spacing:0;margin-left:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--card);border-radius:8px;padding:3px 9px;font-size:13px;font-weight:500;color:#c9c9d0}
.note{font-size:13px;color:var(--mut)}
.note b{color:var(--ink);font-weight:600}
.hint{color:var(--mut);font-size:14px}
.go{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;background:var(--red);color:#fff;border-radius:16px;min-height:60px;font-size:19px;font-weight:700;transition:transform .08s,background .15s}
.go small{font-size:15px;font-weight:500;opacity:.8}
.go:active{transform:scale(.98);background:var(--red2)}
.go:disabled{background:var(--card2);color:#5d5d66}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.b2{background:var(--card);border-radius:14px;min-height:56px;padding:6px;font-weight:700;font-size:16px;line-height:1.15;transition:transform .1s}
.b2 small{display:block;font-size:12px;color:var(--mut);font-weight:500;margin-top:3px}
.b2:active{transform:scale(.97)}
.b2:disabled{opacity:.4}
.b2.locked{color:#5d5d66}.b2.locked small{color:#5d5d66}
.b2.arm{background:var(--red)}.b2.arm small{color:#fff}
.sell{width:100%;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:14px;min-height:52px;font-weight:600;font-size:16px}
.sell:disabled{color:#5d5d66}
.broke{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;padding:10px 12px;font-size:14px;font-weight:500}
.broke[hidden]{display:none}
.broke button{background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 14px;font-weight:600}
h2{font-size:15px;margin:22px 0 10px;font-weight:600;color:var(--mut)}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.mini{flex:none;width:150px;background:var(--card);border-radius:12px;padding:8px;text-align:left}
.mini .v{margin-top:7px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
.mini .v i{width:7px;height:7px;border-radius:50%;background:var(--rc);flex:none}
/* сейф */
.sum{background:var(--card);border-radius:18px;padding:16px;margin-top:14px;display:grid;gap:10px}
.sum .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.sum .t b{font-size:clamp(26px,7.5vw,32px);font-weight:700;letter-spacing:-.03em;white-space:nowrap}
.sum .t span{color:var(--mut);font-size:14px}
.sum .s{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.sum .s em{font-style:normal;color:var(--ink);font-weight:600}
.sum .s em.pos{color:var(--green)}.sum .s em.neg{color:#ff6b6b}
.sum .sellall{background:var(--red);border-radius:12px;min-height:48px;font-weight:700;color:#fff}
.sum .sellall:disabled{background:var(--card2);color:#5d5d66}
.tools{display:grid;gap:8px;margin:12px 0 4px}
.tools .r{display:flex;gap:8px}
.inp{flex:1;background:var(--card);border:1px solid transparent;border-radius:12px;padding:0 14px;min-height:46px;font-size:16px;color:var(--ink)}
.inp::placeholder{color:#5d5d66}
select.inp{flex:none;width:auto;padding-right:8px}
.selbtn{background:var(--card);border-radius:12px;padding:0 14px;font-weight:600;min-height:46px}
.selbtn.on{background:var(--ink);color:var(--bg)}
.cols{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}.cols::-webkit-scrollbar{display:none}
.cols button{flex:none;background:var(--card);border-radius:99px;padding:0 14px;min-height:38px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--mut)}
.cols button.on{background:var(--ink);color:var(--bg)}
.cols button small{opacity:.6;margin-left:4px}
.cols button.add{border:1px dashed var(--line)}
.colbar{display:flex;gap:4px;align-items:center;font-size:14px;color:var(--mut);flex-wrap:wrap}
.colbar[hidden]{display:none}
.colbar button{text-decoration:underline;padding:8px 6px;color:var(--ink)}
.list{display:grid;gap:8px;padding:8px 0}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center;gap:12px;padding:10px;border-radius:14px;background:var(--card);text-align:left;width:100%;position:relative;content-visibility:auto;contain-intrinsic-size:auto 72px}
.row .meta{text-align:right;display:grid;gap:3px;justify-items:end}
.row .meta b{font-size:17px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.row .meta em{font-style:normal;font-size:12px;color:var(--mut)}
.row .ck{position:absolute;left:-6px;top:-6px;width:24px;height:24px;border-radius:50%;border:2px solid #4a4a52;background:var(--bg);display:none}
.selmode .row .ck{display:block}
.row.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.row.sel .ck{background:var(--ink);border-color:var(--ink)}
.row.sel .ck::after{content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg)}
.list.selmode{padding-bottom:90px}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.selbar{position:fixed;left:0;right:0;bottom:calc(70px + env(safe-area-inset-bottom));display:flex;justify-content:center;padding:0 16px;z-index:6}
.selbar[hidden]{display:none}
.selbar div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%;max-width:488px;background:var(--card);border:1px solid var(--line);padding:8px;border-radius:16px;box-shadow:0 10px 30px #000a}
.selbar button{background:var(--card2);border-radius:10px;min-height:46px;font-weight:600;font-size:14px}
.selbar .red{background:var(--red);color:#fff}
.selbar button:disabled{opacity:.4}
/* уровни */
.lvcard{background:var(--card);border-radius:18px;padding:18px;margin-top:14px;display:grid;gap:12px}
.lvcard .n{font-size:30px;font-weight:700;letter-spacing:-.03em}
.lvcard .bar{height:6px;border-radius:3px}
.lvlist{display:grid;gap:6px;margin-top:12px}
.lv{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px}
.lv b{display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:var(--card2);font-weight:700;color:var(--mut)}
.lv.done b{background:var(--ink);color:var(--bg)}.lv.cur{box-shadow:inset 0 0 0 1px #4a4a52}.lv.cur b{background:var(--red);color:#fff}
.lv .d{font-size:14px;font-weight:600}.lv .d small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.lv .bn{font-weight:700;color:var(--green);white-space:nowrap;font-size:15px}
.unl{display:inline-block;background:var(--card2);color:var(--ink);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;margin-left:6px}
/* нижнее меню */
nav{position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:7;display:flex;justify-content:center}
nav div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:520px}
nav button{min-height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:#5d5d66}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--ink)}
/* шторка */
.shade{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.shade[hidden]{display:none}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:#3a3a40;margin:0 auto 12px}
.shd{position:sticky;top:2px;height:0;display:flex;justify-content:flex-end;z-index:3}
.x{width:40px;height:40px;border-radius:50%;background:var(--card2);color:var(--ink);font-size:17px;display:grid;place-items:center;box-shadow:0 2px 12px #000a}
.sheet h3{padding-right:48px}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:700;letter-spacing:-.02em}.sheet p{margin:0 0 12px;color:var(--mut);font-size:14px}
.sheet .mini,.sheet .res{background:var(--card2)}
.opt{display:flex;justify-content:space-between;gap:10px;width:100%;background:var(--card2);border-radius:12px;padding:0 14px;margin-bottom:8px;font-weight:600;min-height:50px;align-items:center;text-align:left}
.opt span{color:var(--mut);font-weight:500}
.opt.danger{color:#ff6b6b}
.opt.green{background:var(--red);color:#fff}.opt.green span{color:#fff;opacity:.85}
.new{display:flex;gap:8px;margin:6px 0 8px}
.new .inp{background:var(--card2)}
.new button{background:var(--ink);color:var(--bg);border-radius:12px;padding:0 16px;font-weight:600;min-height:46px}
.cancel{width:100%;color:var(--mut);min-height:46px;font-weight:500}
.det{display:grid;gap:12px}
.det .res{border-radius:14px;padding:12px 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:10px 0}
.grid2 .mini{width:auto}
.delta{font-size:32px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px}.delta.win{color:var(--green)}.delta.loss{color:#ff6b6b}
.rl{font-size:14px;color:#c9c9d0}.rl h4{margin:16px 0 6px;font-size:15px;color:var(--ink)}
.rl table{width:100%;border-collapse:collapse;font-size:13px}.rl td,.rl th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.rl th{color:var(--mut);font-weight:500}
.rl td:last-child,.rl th:last-child{text-align:right;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);font-weight:600;padding:10px 16px;border-radius:12px;transition:.25s;z-index:30;pointer-events:none;max-width:92vw;text-align:center;box-shadow:0 8px 24px #000a}
.toast.on{opacity:1;transform:translate(-50%,0)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}
/* вход */
.welcome{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;overflow:auto}
.welcome[hidden]{display:none}
.welcome .card{width:100%;max-width:380px;display:grid;gap:12px;text-align:center}
.welcome h2{margin:6px 0 0;font-size:28px;color:var(--ink);font-weight:700}
.welcome .inp{text-align:center;font-size:17px;min-height:52px}
.welcome .err{color:#ff6b6b;font-size:14px;min-height:18px;font-weight:500}
.welcome p{margin:0;color:var(--mut);font-size:14px}
.welcome textarea{width:100%;height:80px;background:var(--card);color:var(--ink);border:0;border-radius:12px;padding:10px;font-size:13px;margin-top:8px}
.welcome summary{color:var(--mut);font-size:14px;cursor:pointer;padding:6px 0}
.welcome .go{min-height:54px;font-size:18px}
@media (prefers-reduced-motion:reduce){.pop,.sheet,.lock .plate,.lock .sim{animation:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <button class="lvl" id="lvlBtn" aria-label="Уровень"><b id="lvN">1</b><span class="pb"><small id="lvT">Уровень 1</small><span class="bar"><i id="lvBar" style="width:0"></i></span></span></button>
  <span class="bal" id="balBox"><span id="bal">0</span>&nbsp;с</span>
  <button class="me" id="meBtn" aria-label="Профиль">?</button>
</header>

<section class="view on" id="v-spin">
  <div class="seg" id="modes"><button data-m="plate" class="on">Госномера</button><button data-m="sim">Сим-карты</button></div>
  <div class="stage" id="stage">
    <div class="big"><div class="pw" id="big"></div></div>
    <div class="res" id="res"></div>
    <button class="go" id="spin">Крутить <small id="spinV">2 000 сом</small></button>
    <div class="row3">
      <button class="b2" id="spin10">×10<small id="spin10V"></small></button>
      <button class="b2" id="spin25">×25<small id="spin25V"></small></button>
      <button class="b2" id="allin">Ва-банк<small id="allinV"></small></button>
    </div>
    <button class="sell" id="sellLast" disabled>Продать</button>
    <div class="broke" id="broke" hidden><span>Не хватает на прокрутку</span><button id="restart">Начать заново</button></div>
  </div>
  <h2>Последние</h2>
  <div class="strip" id="recent"></div>
</section>

<section class="view" id="v-safe">
  <div class="sum"><div class="t"><b id="sval">0 сом</b><span id="scnt">0 шт</span></div>
    <div class="s"><span>Итог игры <em id="sPL">0</em></span><span>Прокруток <em id="sN">0</em></span><span>Лучший <em id="sBest">—</em></span></div>
    <button class="sellall" id="quick">Продать всё</button></div>
  <div class="tools">
    <div class="seg" id="kinds"><button data-k="all" class="on">Всё</button><button data-k="plate">Номера</button><button data-k="sim">Сим</button></div>
    <div class="r"><input class="inp" id="q" placeholder="Поиск: 777, AAA, 0555" inputmode="search" autocomplete="off">
      <select class="inp" id="sort" aria-label="Сортировка"><option value="price">Дороже</option><option value="cheap">Дешевле</option><option value="date">Новые</option><option value="reg">Регион</option></select></div>
    <div class="cols" id="cols"></div>
    <div class="colbar" id="colbar" hidden></div>
    <div class="r" style="justify-content:flex-end"><button class="selbtn" id="selMode">Выбрать несколько</button></div>
  </div>
  <div class="list" id="list"></div>
</section>

<section class="view" id="v-lvl">
  <div class="lvcard" id="lvCard"></div>
  <div class="lvlist" id="lvList"></div>
</section>
</div>

<div class="selbar" id="selbar" hidden><div><button id="selAll">Все</button><button id="toCol" disabled>В коллекцию</button><button class="red" id="sellSel" disabled>Продать</button></div></div>

<nav><div>
  <button data-v="spin" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 10v4M10 12h9"/></svg>Крутить</button>
  <button data-v="safe"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="12" r="3.5"/><path d="M12 8.5v-1M15.5 12h1"/></svg>Сейф</button>
  <button data-v="lvl"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V14M10 20V9M16 20V4M2 20h20"/></svg>Уровни</button>
</div></nav>

<div class="shade" id="shade" hidden><div class="sheet" id="sheet"></div></div>
<div class="welcome" id="auth" hidden><form class="card" id="aForm" novalidate>
  <div class="pw" id="aPlate"></div><h2>Номера KG</h2>
  <div class="seg" id="aTabs"><button type="button" data-t="in" class="on">Вход</button><button type="button" data-t="up">Регистрация</button></div>
  <input class="inp" id="aNick" maxlength="16" placeholder="Никнейм" autocomplete="username" autocapitalize="off" spellcheck="false">

  const D='0123456789',d=()=>pick(D.slice(1));
  const gens=[[50,()=>d()+'00000'],[30,()=>{const a=d(),i=Math.floor(Math.random()*6);const z=[...'000000'];z[i]=a;return z.join('')}],[13,()=>{const a=d();return a+a+'0000'}],[3,()=>{const a=d();return a+'0000'+a}],[2,()=>pick(D).repeat(6)],[2,()=>{const x=d()+pick(D)+pick(D);return x+x}]];
  const tot=gens.reduce((a,g)=>a+g[0],0);
  for(let k=0;k<300;k++){let t=Math.random()*tot,g=gens[0][1];for(const [w,fn] of gens){t-=w;if(t<0){g=fn;break}}

function reel(p,done){
  const big=$('big');if(reduced()){done();return}
  if(isSim(p)){
    big.innerHTML=simHTML({op:p.op,pre:p.pre,s:'000000'});const sn=big.querySelector('.sn'),pre='<i>'+p.pre+'</i> ',card=big.firstElementChild;
    const t0=performance.now();let last=0,locked=-1;
    const fr=t=>{const lock=Math.max(0,Math.floor((t-t0-260)/140));if(lock>=6){done();return}
      if(t-last>50){last=t;const ch=[...p.s].map((c,i)=>i<lock?c:pick(DIG)).join('');sn.innerHTML=pre+ch.slice(0,3)+' '+ch.slice(3);
        if(lock!==locked){locked=lock;big.classList.remove('lock');void card.offsetWidth;big.classList.add('lock')}}
      requestAnimationFrame(fr)};requestAnimationFrame(fr);return}
  const old=p.fmt==='old';

  const pools=old?[OLDK,DIG,DIG,DIG,DIG,LET,LET]:['0','123456789',DIG,DIG,DIG,LET,LET,LET];
  big.innerHTML=plateHTML(old?{fmt:'old',r:p.r,d:'0000',l:'AA'}:{fmt:'new',r:p.r,d:'000',l:'AAA'});

    if(t-last>50){last=t;const ch=slots.map((c,i)=>i<lock?c:pick(pools[i]));
      if(old){sp[0].textContent=ch[0];sp[1].textContent=ch.slice(1,5).join('');sp[2].textContent=ch.slice(5).join('')}

const fx=$('fx'),cx=fx.getContext('2d');let parts=[],fxRaf=0;
function burst(tier){
  if(reduced())return;
  const dpr=Math.min(2,devicePixelRatio||1);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr;cx.setTransform(dpr,0,0,dpr,0,0);
  const r=$('big').getBoundingClientRect(),ox=r.left+r.width/2,oy=r.top+r.height/2;
  const col=getComputedStyle(document.documentElement).getPropertyValue(RAR[tier][1]).trim();
  const cols=[col,col,'#ffd400','#e30a17','#14a05a'],n=tier===4?120:tier===3?80:45;
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*(tier===4?10:6);parts.push({x:ox,y:oy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,w:4+Math.random()*5,h:6+Math.random()*6,r:Math.random()*6,vr:Math.random()*.6-.3,c:pick(cols),life:60+Math.random()*40})}
  cancelAnimationFrame(fxRaf);
  const step=()=>{cx.clearRect(0,0,innerWidth,innerHeight);parts=parts.filter(q=>q.life>0);
    for(const q of parts){q.vy+=.28;q.vx*=.985;q.x+=q.vx;q.y+=q.vy;q.r+=q.vr;q.life--;cx.save();cx.globalAlpha=Math.min(1,q.life/30);cx.translate(q.x,q.y);cx.rotate(q.r);cx.fillStyle=q.c;cx.fillRect(-q.w/2,-q.h/2,q.w,q.h*Math.abs(Math.cos(q.r*2)));cx.restore()}

let cur='all',sel=new Set(),selMode=false,shown=60,kindF='all';
const sorters={price:(a,b)=>b.price-a.price,cheap:(a,b)=>a.price-b.price,date:(a,b)=>b.t-a.t,reg:(a,b)=>code(a).localeCompare(code(b))||b.price-a.price};
const inView=c=>(kindF==='all'||(kindF==='sim')===isSim(c))&&(cur==='all'||(cur==='none'?!c.c:c.c===cur));
function filtered(){
  const q=$('q').value.trim().toUpperCase().replace(/\s+/g,'');
  return S.col.filter(c=>inView(c)&&(!q||keyStr(c).includes(q)||(!isSim(c)&&(c.d+c.l).includes(q))));
}
function drawSafe(){
  const view=S.col.filter(inView),items=filtered().sort(sorters[$('sort').value]);
  $('sval').textContent=fmt(view.reduce((s,c)=>s+c.price,0));$('scnt').textContent=num(view.length)+' шт';drawStats();
  const free=S.col.filter(c=>!c.c);$('quick').disabled=!free.length;$('quick').textContent=free.length?`Продать всё · +${fmt(free.reduce((s,c)=>s+c.price,0))}`:'Продать всё';
  const cn=S.cols.find(c=>c.id===cur),cnt=id=>S.col.filter(c=>c.c===id).length;
  $('cols').innerHTML=`<button data-c="all" class="${cur==='all'?'on':''}">Все<small>${S.col.length}</small></button><button data-c="none" class="${cur==='none'?'on':''}">Без коллекции<small>${free.length}</small></button>`
    +S.cols.map(c=>`<button data-c="${c.id}" class="${cur===c.id?'on':''}">${esc(c.name)}<small>${cnt(c.id)}</small></button>`).join('')+'<button class="add" data-c="+">+ Коллекция</button>';
  $('colbar').hidden=!cn;if(cn)$('colbar').innerHTML=`«${esc(cn.name)}»<button data-a="ren">Переименовать</button><button data-a="del">Удалить</button>`;
  $('list').classList.toggle('selmode',selMode);
  const list=items.slice(0,shown);
  $('list').innerHTML=list.length?list.map(c=>{const cl=c.c&&S.cols.find(x=>x.id===c.c);
    return `<button class="row ${sel.has(c.id)?'sel':''}" data-id="${c.id}"><span class="ck"></span><div class="pw">${itemHTML(c)}</div><div class="meta"><b>${fmt(c.price)}</b>${pill(c.tier)}${cl?`<em>${esc(cl.name)}</em>`:''}</div></button>`}).join('')
    +(items.length>shown?`<button class="selbtn" id="more" style="width:100%">Показать ещё ${items.length-shown}</button>`:'')
    :`<div class="empty">${S.col.length?'Ничего не найдено':'Сейф пуст. Все выпавшие номера попадают сюда.'}</div>`;
  drawSelBar();
}
function drawSelBar(){
  $('selbar').hidden=!selMode||!$('v-safe').classList.contains('on');
  $('selMode').classList.toggle('on',selMode);$('selMode').textContent=selMode?'Готово':'Выбрать несколько';
  $('toCol').disabled=!sel.size;$('sellSel').disabled=!sel.size;
  const v=S.col.filter(c=>sel.has(c.id)).reduce((s,c)=>s+c.price,0);
  $('sellSel').textContent=sel.size?`Продать ${sel.size} · ${short(v)}`:'Продать';$('selAll').textContent=sel.size?'Снять':'Все';
}
$('cols').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;if(b.dataset.c==='+'){newColSheet();return}cur=b.dataset.c;sel.clear();shown=60;drawSafe()});
$('colbar').addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const cn=S.cols.find(c=>c.id===cur);if(!cn)return;
  if(b.dataset.a==='ren')renameSheet(cn);
  else if(confirmTap('del'+cn.id,'Номера вернутся в общий сейф. Нажмите ещё раз')){S.col.forEach(c=>{if(c.c===cn.id)c.c=''});S.cols=S.cols.filter(c=>c!==cn);cur='all';save();drawSafe();toast('Коллекция удалена')}});
$('kinds').addEventListener('click',e=>{const b=e.target.closest('[data-k]');if(!b)return;kindF=b.dataset.k;for(const x of $('kinds').children)x.classList.toggle('on',x===b);sel.clear();shown=60;drawSafe()});
$('sort').addEventListener('change',drawSafe);
let qT=0;$('q').addEventListener('input',()=>{clearTimeout(qT);qT=setTimeout(()=>{shown=60;drawSafe()},150)});
$('selMode').addEventListener('click',()=>{selMode=!selMode;sel.clear();drawSafe()});
$('list').addEventListener('click',e=>{
  if(e.target.closest('#more')){shown+=60;drawSafe();return}
  const r=e.target.closest('.row');if(!r)return;const id=r.dataset.id;
  if(!selMode){openDetail(id);return}
  sel.has(id)?sel.delete(id):sel.add(id);r.classList.toggle('sel');drawSelBar()});
$('selAll').addEventListener('click',()=>{if(sel.size)sel.clear();else filtered().forEach(c=>sel.add(c.id));drawSafe()});
$('sellSel').addEventListener('click',()=>{if(!sel.size)return;const ids=[...sel];sel.clear();sell(ids)});
$('toCol').addEventListener('click',()=>{if(sel.size)moveSheet([...sel])});
$('quick').addEventListener('click',()=>{const ids=S.col.filter(c=>!c.c).map(c=>c.id);if(!ids.length)return;
  const v=S.col.filter(c=>!c.c).reduce((s,c)=>s+c.price,0);
  if(confirmTap('quick',`Продать ${ids.length} шт. за ${fmt(v)}? Нажмите ещё раз. Номера в коллекциях останутся`))sell(ids)});

/* ===== уровни: экран ===== */
function drawLevels(){
  const n=S.lvl,a=lvNeed(n),b=lvNeed(n+1),k=Math.max(0,Math.min(1,(S.bal-a)/(b-a)));
  const nextU=Object.keys(UNLOCK).map(Number).find(x=>x>n);
  $('lvCard').innerHTML=`<div class="n">Уровень ${n}</div>
    <div class="bar"><i style="width:${(k*100).toFixed(1)}%"></i></div>
    <div class="hint">До ${n+1} уровня нужно <b style="color:var(--ink)">${fmt(b)}</b> на балансе — осталось ${fmt(Math.max(0,b-S.bal))}. Бонус: <b style="color:var(--green)">+${fmt(lvBonus(n+1))}</b></div>
    ${nextU?`<div class="hint">Уровень ${nextU} откроет: <b style="color:var(--ink)">${UNLOCK[nextU]}</b></div>`:''}
    <button class="opt" id="rulesBtn">Как считается цена номеров<span>›</span></button>`;
  const max=Math.max(15,n+8);let h='';
  for(let i=2;i<=max;i++)h+=`<div class="lv ${i<=n?'done':''} ${i===n+1?'cur':''}"><b>${i}</b><div class="d">${fmt(lvNeed(i))} на балансе${UNLOCK[i]?`<span class="unl">${UNLOCK[i]}</span>`:''}<small>${i<=n?'Получен':i===n+1?'Следующий':'Закрыт'}</small></div><span class="bn">+${short(lvBonus(i))}</span></div>`;
  $('lvList').innerHTML=h;
}

function openSheet(html){$('sheet').innerHTML='<div class="shd"><button class="x" aria-label="Закрыть">✕</button></div>'+html;$('sheet').onclick=null;$('shade').hidden=false;$('sheet').scrollTop=0}
function closeSheet(){$('shade').hidden=true}
$('shade').addEventListener('click',e=>{if(e.target===$('shade')||e.target.closest('.cancel,.x'))closeSheet()});
/* свайп вниз закрывает окно */
{let y0=null,dy=0;const sh=$('sheet');sh.addEventListener('touchstart',e=>{y0=sh.scrollTop<=0?e.touches[0].clientY:null;dy=0},{passive:true});sh.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;sh.style.transform=dy>0?'translateY('+dy+'px)':''},{passive:true});sh.addEventListener('touchend',()=>{if(y0==null)return;sh.style.transform='';y0=null;if(dy>90)closeSheet()})}
function addCol(name){name=name.trim().slice(0,30);if(!name)return null;const c={id:'c'+Date.now().toString(36),name};S.cols.push(c);save();return c}
function openDetail(id){
  const p=S.col.find(c=>c.id===id);if(!p)return;const cl=p.c&&S.cols.find(x=>x.id===p.c);
  openSheet(`<div class="det"><div><h3>${labelOf(p)}</h3><p>${placeOf(p)}${cl?' · коллекция «'+esc(cl.name)+'»':''}</p></div>
    <div class="pw">${itemHTML(p)}</div><div class="res">${resHTML(p)}</div>
    <div class="row3" style="grid-template-columns:1fr 1fr"><button class="b2" id="dCol">${cl?'Другая коллекция':'В коллекцию'}</button><button class="b2" id="dSell" style="background:var(--red);color:#fff">Продать<small>+${fmt(p.price)}</small></button></div><button class="cancel">Закрыть</button></div>`);
  $('sheet').onclick=e=>{if(e.target.closest('#dSell')){closeSheet();sell([id])}else if(e.target.closest('#dCol'))moveSheet([id])};
}
function moveSheet(ids){
  const set=new Set(ids);
  openSheet(`<h3>В коллекцию</h3><p>Номеров: ${ids.length}. Номера в коллекциях не продаются кнопкой «Продать всё».</p>`
    +S.cols.map(c=>`<button class="opt" data-m="${c.id}">${esc(c.name)}<span>${S.col.filter(x=>x.c===c.id).length} шт</span></button>`).join('')
    +`<div class="new"><input class="inp" id="ncol" placeholder="Новая, например «Бишкек»" maxlength="30"><button id="ncolBtn">Создать</button></div>`
    +`<button class="opt danger" data-m="">Убрать из коллекции<span></span></button><button class="cancel">Отмена</button>`);
  const move=id=>{S.col.forEach(c=>{if(set.has(c.id))c.c=id});sel.clear();save();closeSheet();if($('v-safe').classList.contains('on'))drawSafe();
    toast(id?`${ids.length} шт. → «${S.cols.find(c=>c.id===id).name}»`:'Убрано из коллекции')};
  $('sheet').onclick=e=>{const b=e.target.closest('[data-m]');if(b){move(b.dataset.m);return}
    if(e.target.closest('#ncolBtn')){const c=addCol($('ncol').value);if(c)move(c.id);else toast('Введите название')}};
}
function newColSheet(){
  openSheet(`<h3>Новая коллекция</h3><p>Например: «Бишкек», «Старые блатные», «На продажу».</p><div class="new"><input class="inp" id="ncol" maxlength="30" placeholder="Название"><button id="ncolBtn">Создать</button></div><button class="cancel">Отмена</button>`);
  $('sheet').onclick=e=>{if(e.target.closest('#ncolBtn')){const c=addCol($('ncol').value);if(!c){toast('Введите название');return}closeSheet();cur='all';selMode=true;drawSafe();toast('Выберите номера и нажмите «В коллекцию»')}};
}
function renameSheet(cn){
  openSheet(`<h3>Переименовать</h3><div class="new"><input class="inp" id="ncol" maxlength="30" value="${esc(cn.name)}"><button id="ncolBtn">Сохранить</button></div><button class="cancel">Отмена</button>`);

/* ===== навигация ===== */
function go(v){
  for(const s of document.querySelectorAll('.view'))s.classList.toggle('on',s.id==='v-'+v);
  for(const b of document.querySelectorAll('nav button'))b.classList.toggle('on',b.dataset.v===v);
  if(v==='safe'){sel.clear();selMode=false;shown=60;drawSafe()}else{$('selbar').hidden=true}
  if(v==='spin')drawRecent();if(v==='lvl')drawLevels();
  window.scrollTo(0,0);
}
for(const b of document.querySelectorAll('nav button'))b.addEventListener('click',()=>go(b.dataset.v));
$('lvlBtn').addEventListener('click',()=>go('lvl'));
function setMode(m){
  S.mode=m;for(const b of $('modes').children)b.classList.toggle('on',b.dataset.m===m);
  drawButtons();const last=S.col.find(c=>c.id===S.last);if(last&&isSim(last)===(m==='sim'))showResult(last,false);else idle();
}
$('modes').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b||spinning)return;setMode(b.dataset.m);save()});

/* ===== аккаунты (Firebase) ===== */
const NICK_RE=/^[A-Za-zА-Яа-яЁёӨөҮүҢң0-9_]{3,16}$/;
const mailNick=m=>{const h=String(m||'').match(/^u([0-9a-f]+)@/);if(!h)return '';try{return new TextDecoder().decode(new Uint8Array(h[1].match(/../g).map(x=>parseInt(x,16))))}catch(e){return ''}};
const nickMail=n=>'u'+[...new TextEncoder().encode(n.toLowerCase())].map(x=>x.toString(16).padStart(2,'0')).join('')+'@nomera-kg.game';
let pendSt=null,tab='in';
function drawNick(){$('meBtn').textContent=(S.nick||'?').slice(0,1).toUpperCase()}
function applyState(st){
  S=Object.assign(FRESH(),st);shownBal=S.bal;$('bal').textContent=num(S.bal);
  setMode(S.mode==='sim'?'sim':'plate');drawBal();drawRecent();drawStats();drawNick();
  if($('v-safe').classList.contains('on'))drawSafe();if($('v-lvl').classList.contains('on'))drawLevels();
}
function cloudSave(){if(!uid||!fb)return;dirty=true;clearTimeout(cloudT);cloudT=setTimeout(flush,2500)}
async function flush(){
  if(!dirty||!uid||!fb)return;dirty=false;clearTimeout(cloudT);
  const data=packState(S);
  if(data.length>900000)toast('Сейф почти переполнен — продайте часть номеров');
  try{await fb.db.collection('users').doc(uid).set({nick:S.nick||'',state:data,bal:S.bal,lvl:S.lvl,updated:firebase.firestore.FieldValue.serverTimestamp()})}
  catch(e){dirty=true;cloudT=setTimeout(flush,8000)}
}
function setTab(t){tab=t;for(const b of $('aTabs').children)b.classList.toggle('on',b.dataset.t===t);
  const up=t==='up';$('aPass2').hidden=!up;$('aImp').hidden=!up;$('aGo').textContent=up?'Создать аккаунт':'Войти';
  $('aPass').placeholder=up?'Пароль (от 6 символов)':'Пароль';$('aPass').autocomplete=up?'new-password':'current-password';
  $('aHint').textContent=up?'Пароль нельзя восстановить — запомните его.':'Нет аккаунта? Нажмите «Регистрация».';$('aErr').textContent='';
  if(up&&LEGACY&&!$('aCode').value){$('aCode').value=packState(LEGACY);$('aImp').open=true;$('aGo').textContent='Создать аккаунт с прогрессом';$('aHint').textContent='Нашли прогресс на этом устройстве ('+LEGACY.col.length+' шт) — он перейдёт в аккаунт.'}}
function showAuth(){$('aPlate').innerHTML=plateHTML({fmt:'new',r:'01',d:'777',l:'KGZ'});$('auth').hidden=false;$('aGo').disabled=false}
$('aTabs').addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(b)setTab(b.dataset.t)});
const ERR={'auth/email-already-in-use':'Такой никнейм уже занят','auth/weak-password':'Пароль слишком простой — от 6 символов',
  'auth/invalid-credential':'Неверный никнейм или пароль','auth/invalid-login-credentials':'Неверный никнейм или пароль','auth/wrong-password':'Неверный никнейм или пароль','auth/user-not-found':'Неверный никнейм или пароль',
  'auth/too-many-requests':'Слишком много попыток — подождите пару минут','auth/network-request-failed':'Нет интернета','auth/operation-not-allowed':'В Firebase не включён вход по паролю'};
$('aForm').addEventListener('submit',async e=>{
  e.preventDefault();const nick=$('aNick').value.trim(),pass=$('aPass').value,err=$('aErr');err.textContent='';
  if(!fb){err.textContent='Сервер не подключён';return}
  if(!NICK_RE.test(nick)){err.textContent='Никнейм: 3–16 букв, цифр или _';return}
  if(pass.length<6){err.textContent='Пароль — от 6 символов';return}
  if(tab==='up'){
    if(pass!==$('aPass2').value){err.textContent='Пароли не совпадают';return}
    let st=FRESH();const c=$('aCode').value.trim();
    if(c){const imp=unpackState(c);if(!imp){err.textContent='Код переноса не подошёл';return}st=Object.assign(FRESH(),imp)}
    st.nick=nick;pendSt=st;
  }
  $('aGo').disabled=true;
  try{tab==='up'?await fb.auth.createUserWithEmailAndPassword(nickMail(nick),pass):await fb.auth.signInWithEmailAndPassword(nickMail(nick),pass)}
  catch(x){err.textContent=ERR[x.code]||'Ошибка: '+(x.code||x.message);$('aGo').disabled=false;pendSt=null}
});

  openSheet(`<h3>${esc(S.nick||'Игрок')}</h3><p>Уровень ${S.lvl} · ${fmt(S.bal)} · ${S.col.length} шт в сейфе. Прогресс сохраняется в аккаунте.</p>

      try{await fb.auth.currentUser.updatePassword(v);toast('Пароль изменён');closeSheet()}

$('aCode').addEventListener('input',()=>{if(tab==='up')$('aGo').textContent=$('aCode').value.trim()?'Создать аккаунт с прогрессом':'Создать аккаунт'});

/* запуск */

$('sPlate').innerHTML=plateHTML({fmt:'new',r:'01',d:'777',l:'KGZ'});setTab('in');
const cfgOk=typeof firebase!=='undefined'&&FIREBASE_CONFIG&&!String(FIREBASE_CONFIG.apiKey).startsWith('ВСТАВЬТЕ');
if(!cfgOk){$('sMsg').textContent=typeof firebase==='undefined'?'Нет связи с сервером. Проверьте интернет и обновите страницу.':'Игра не подключена к серверу.'}
else{
